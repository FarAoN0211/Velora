name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas con PostgreSQL y FFmpeg de la imagen de desarrollo
        run: |
          export VELORA_DEV_UID=$(id -u) VELORA_DEV_GID=$(id -g)
          docker compose -p velora-ci -f deploy/compose.dev.yaml build go
          docker compose -p velora-ci -f deploy/compose.dev.yaml run --rm go sh -c 'go vet ./... && go test -count=1 ./...'
      - name: Limpiar solo los datos efímeros de CI
        if: always()
        run: docker compose -p velora-ci -f deploy/compose.dev.yaml down -v
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run tokens:check
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: node --test web/tests/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - working-directory: clientes/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exportar sin datos privados y comprobar la web exportada
        run: |
          python3 scripts/export_public.py "$RUNNER_TEMP/velora-export"
          python3 scripts/audit_public.py "$RUNNER_TEMP/velora-export"
          npm --prefix "$RUNNER_TEMP/velora-export/web" ci
          npm --prefix "$RUNNER_TEMP/velora-export/web" run tokens:check
          npm --prefix "$RUNNER_TEMP/velora-export/web" run build
      - name: Validar el arranque sin configuración previa
        run: docker compose config --quiet
