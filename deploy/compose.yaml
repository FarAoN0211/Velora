name: velora
x-app: &app
  image: velora:${VELORA_VERSION:-0.22.5}
  user: ${VELORA_UID:-1000}:${VELORA_GID:-100}
  environment: &environment
    VELORA_DATABASE_URL: ${VELORA_DATABASE_URL:-}
    VELORA_CONFIG_DIR: /config
    VELORA_BACKUP_DIR: /backups
    VELORA_WEB_DIR: /usr/share/velora/web
    VELORA_MEDIA_ROOTS: /media,/host
    VELORA_MIN_FREE_GB: ${VELORA_MIN_FREE_GB:-5}
    VELORA_SECURE_COOKIES: ${VELORA_SECURE_COOKIES:-false}
    VELORA_PUBLIC_URLS: ${VELORA_PUBLIC_URLS:-}
    VELORA_TRUSTED_PROXIES: ${VELORA_TRUSTED_PROXIES:-}
    VELORA_TZ: ${VELORA_TZ:-Europe/Madrid}
    VELORA_MAX_REMUX: ${VELORA_MAX_REMUX:-2}
  volumes:
    - credentials:/run/velora-secrets:ro
    - config:/config
    - backups:/backups
    - ${VELORA_MEDIA_PATH:-../media}:/media:ro
    # Navegación del servidor anfitrión; nunca permite escribir en sus archivos.
    - type: bind
      source: ${VELORA_HOST_PATH:-/}
      target: /host
      read_only: true
      bind:
        create_host_path: false
    - ${VELORA_OTA_PATH:-../dist/ota}:/usr/share/velora/web/ota:ro
  depends_on:
    init:
      condition: service_completed_successfully
    db:
      condition: service_healthy
  restart: unless-stopped
services:
  init:
    image: alpine:3.23
    entrypoint: [/bin/sh, /bootstrap/init-secrets.sh]
    environment:
      VELORA_DB_PASSWORD: ${VELORA_DB_PASSWORD:-}
    volumes:
      - credentials:/run/velora-secrets
      - ./init-secrets.sh:/bootstrap/init-secrets.sh:ro
    restart: "no"
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velora
      POSTGRES_DB: velora
      POSTGRES_PASSWORD_FILE: /run/velora-secrets/db_password
    volumes:
      - database:/var/lib/postgresql/data
      - credentials:/run/velora-secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, pg_isready -U velora -d velora]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped
  server:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VELORA_VERSION:-0.22.5}
    command: [serve]
    ports:
      - ${VELORA_BIND:-0.0.0.0}:${VELORA_PORT:-8640}:8640
    mem_limit: 2g
  worker:
    <<: *app
    command: [worker]
    mem_limit: 1536m
    cpus: 2
volumes:
  credentials:
  database:
  config:
  backups:
